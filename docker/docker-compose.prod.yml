# VM deployment. Copied to the VM by the deploy workflow alongside a rendered
# .env (chmod 600) and the Caddyfile.
#
# PREREQUISITE if you run Postgres here: a SEPARATE persistent disk mounted at
# /mnt/pgdata. Do not skip this. See docs/architecture/iac.md.
#
#   gcloud compute disks create contactbook-pgdata --size=20GB --type=pd-balanced \
#     --zone=europe-west2-c
#   gcloud compute instances attach-disk contactbook-server \
#     --disk=contactbook-pgdata --zone=europe-west2-c
#   # then on the VM: mkfs.ext4 (first time only), mount, add to /etc/fstab
#
# Traffic: internet -> Caddy (:80/:443, Let's Encrypt) -> api:8080 on an
# internal network. The app port is never published to the host.
services:
  caddy:
    image: caddy:2-alpine
    container_name: contactbook-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE}
    container_name: contactbook-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: only Caddy reaches this, over the internal network.

  postgres:
    image: postgres:16-alpine
    container_name: contactbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # A BIND MOUNT to the attached disk, deliberately not a named volume.
      # `docker compose down -v` deletes named volumes; it cannot touch this.
      # On a host that now holds the only copy of production data, that
      # difference is worth the slightly uglier config.
      - /mnt/pgdata:/var/lib/postgresql/data
    # Never published to the host, let alone the internet. The API reaches it
    # over the internal Docker network as `postgres:5432`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
