# VM deployment. Copied to the VM by the deploy workflow alongside a rendered
# .env (chmod 600), the Supabase root cert, and the Caddyfile.
#
# No local Postgres here on purpose — Postgres is Supabase, reached over the
# network via the Supavisor pooler (see CLAUDE.md / docs/architecture/hld.md
# "Data store"). An earlier version of this file ran Postgres on the VM
# itself; that predates the Supabase decision and was never updated to match.
#
# Traffic: internet -> Caddy (:80/:443, Let's Encrypt) -> api:8080 on an
# internal network. The app port is never published to the host.
services:
  caddy:
    image: caddy:2-alpine
    container_name: contactbook-caddy
    restart: unless-stopped
    env_file: [.env] # for CADDY_API_DOMAIN, substituted into the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE}
    container_name: contactbook-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8080"
    volumes:
      # Supabase's pooler chains through a project-specific root CA absent
      # from every public trust store — sslrootcert in DATABASE_URL/DIRECT_URL
      # points at this container path. See docs/architecture/iac.md §5.2.
      - ./supabase-ca.crt:/etc/contactbook/supabase-ca.crt:ro
    # No published ports: only Caddy reaches this, over the internal network.

volumes:
  caddy_data:
  caddy_config:
