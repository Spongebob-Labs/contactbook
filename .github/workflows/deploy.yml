name: Deploy API

on:
  push:
    branches: [main, refac-new-build]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "docker/docker-compose.prod.yml"
      - "docker/Caddyfile"
      - "scripts/render-api-env.sh"
      - ".github/workflows/deploy.yml"

# Never run two deploys of the same branch concurrently — a docker-compose
# restart racing a migration from a second run is exactly the kind of thing
# that only shows up in production.
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # prisma.config.ts calls env('DIRECT_URL') at config-LOAD time (every
    # prisma CLI invocation, including plain `generate`) — it only checks the
    # var is set, generate itself never connects. A placeholder is enough;
    # only the real `migrate` job below needs the actual Supabase URL.
    env:
      DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api lint
      - run: pnpm --filter api build
      - run: pnpm --filter api test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    # Environment-scoped so `main` and this branch can each hold their own
    # value under the SAME secret name (DATABASE_URL, TASKS_TARGET_BASE_URL,
    # ...) without colliding — set these under Settings → Environments →
    # staging, not as repository-wide secrets.
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api
      - name: Write Supabase root cert
        # Same path already baked into the DIRECT_URL secret's sslrootcert=
        # (the one meant for the VM's container) -- writing it here too means
        # the same secret value works unmodified in both places, rather than
        # needing a CI-specific DIRECT_URL that only differs by this path.
        run: |
          sudo mkdir -p /etc/contactbook
          echo "${{ secrets.SUPABASE_CA_CERT }}" | sudo tee /etc/contactbook/supabase-ca.crt > /dev/null
      - name: Block deploy if a pending migration would fail on existing NULLs
        # Prevents a repeat of the 2026-08-28 incident: a migration doing
        # ALTER COLUMN ... SET NOT NULL reached this database before its
        # backfill script had ever been run against it, Postgres rejected the
        # ALTER, and `prisma migrate deploy` left the migration history
        # marked FAILED — blocking every later migration (unrelated ones
        # included) until manually resolved. This step catches that class of
        # failure before Prisma ever touches the database, with a message
        # that names the exact table/column/migration instead of a bare
        # Postgres error code.
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx ts-node scripts/check-not-null-migrations.ts
      - name: Run migrations against Supabase directly (session-mode URL, not the pooler)
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

  build-and-push:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # Not passed via a job output on purpose -- GitHub redacts a
          # secret (DOCKER_USERNAME) wherever an output containing it gets
          # READ in another job, which turned this into an empty value in
          # `deploy` below rather than a partially-masked one. Confirmed
          # live: docker-compose failed with "service api has neither an
          # image nor a build context specified". Both DOCKER_USERNAME and
          # github.sha are already available directly in any job that
          # needs them -- there was never a reason to relay this one.
          tags: ${{ secrets.DOCKER_USERNAME }}/contactbook-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render .env from secrets
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_OTP_CONTENT_SID: ${{ secrets.TWILIO_OTP_CONTENT_SID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TASKS_QUEUE_PRIORITY: ${{ secrets.TASKS_QUEUE_PRIORITY }}
          TASKS_QUEUE_OUTBOUND: ${{ secrets.TASKS_QUEUE_OUTBOUND }}
          TASKS_TARGET_BASE_URL: ${{ secrets.TASKS_TARGET_BASE_URL }}
          TASKS_OIDC_AUDIENCE: ${{ secrets.TASKS_OIDC_AUDIENCE }}
          TASKS_INVOKER_SA: ${{ secrets.TASKS_INVOKER_SA }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
          GCS_PROFILE_PHOTOS_BUCKET: ${{ secrets.GCS_PROFILE_PHOTOS_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
          WALLET_PASS_TYPE_ID: ${{ secrets.WALLET_PASS_TYPE_ID }}
          WALLET_TEAM_ID: ${{ secrets.WALLET_TEAM_ID }}
          WALLET_ORG_NAME: ${{ secrets.WALLET_ORG_NAME }}
          WALLET_WEB_SERVICE_URL: ${{ secrets.WALLET_WEB_SERVICE_URL }}
          WALLET_SIGNER_CERT_B64: ${{ secrets.WALLET_SIGNER_CERT_B64 }}
          WALLET_SIGNER_KEY_B64: ${{ secrets.WALLET_SIGNER_KEY_B64 }}
          WALLET_SIGNER_KEY_PASSPHRASE: ${{ secrets.WALLET_SIGNER_KEY_PASSPHRASE }}
          WALLET_WWDR_CERT_B64: ${{ secrets.WALLET_WWDR_CERT_B64 }}
          WALLET_AUTH_SECRET: ${{ secrets.WALLET_AUTH_SECRET }}
        run: OUTPUT_PATH=./rendered.env bash scripts/render-api-env.sh

      - name: Append container-internal sslrootcert paths
        run: |
          # The .env above has DATABASE_URL/DIRECT_URL without sslrootcert —
          # render-api-env.sh doesn't know the container path; append it here
          # since it's fixed by docker-compose.prod.yml's volume mount.
          sed -i \
            -e "s#\(DATABASE_URL=.*\)#\1\&sslrootcert=/etc/contactbook/supabase-ca.crt#" \
            -e "s#\(DIRECT_URL=.*\)#\1?sslrootcert=/etc/contactbook/supabase-ca.crt#" \
            ./rendered.env

      - name: Write Supabase root cert
        run: echo "${{ secrets.SUPABASE_CA_CERT }}" > ./rendered-supabase-ca.crt

      - name: Loosen permissions for the SCP step's own container to read
        # render-api-env.sh chmod 600s the file (correct for its life on the
        # VM), but appleboy/scp-action tars it up from inside its own Docker
        # container as a different effective user than the one that created
        # it -- 600 blocks that read entirely. Re-tightened to 600 on the VM
        # itself in the very next job step, so this is safe: this copy only
        # ever exists on the ephemeral, single-use Actions runner.
        run: chmod 644 rendered.env rendered-supabase-ca.crt

      # Two separate copies, not one with strip_components: 1 -- the docker/*
      # files and the rendered.* files sit at different path depths (one has
      # a directory prefix to strip, the other doesn't), and a single
      # strip_components value applied uniformly strips the ROOT-level
      # files' own filename instead of a directory. Confirmed live: the
      # combined version reported success (scp itself didn't error) while
      # silently failing to land rendered.env at all.
      - name: Copy docker-compose + Caddyfile to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker/docker-compose.prod.yml,docker/Caddyfile"
          target: "~/contactbook-api-staging"
          strip_components: 1

      - name: Copy rendered .env + cert to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "rendered.env,rendered-supabase-ca.crt"
          target: "~/contactbook-api-staging"

      - name: Restart containers on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Built the same way build-and-push's tag is, directly from
          # DOCKER_USERNAME + github.sha -- not relayed via a job output,
          # since that's what produced an unusable empty value before.
          script: |
            set -euo pipefail
            cd ~/contactbook-api-staging
            mv rendered.env .env
            mv rendered-supabase-ca.crt supabase-ca.crt
            chmod 600 .env supabase-ca.crt
            # The pre-rebuild API is still running on this VM under these
            # exact container names, unmanaged by this (or any) compose
            # project -- docker compose can't "recreate" a container it
            # doesn't own, so `up` fails on a naming conflict instead.
            # Confirmed live. This is the rebuild's first deploy tearing it
            # down, exactly as docs/architecture/README.md's confirmed
            # constraints already called out as the expected first-deploy
            # behavior -- not a surprise, not a workaround.
            docker rm -f contactbook-api contactbook-caddy 2>/dev/null || true
            export API_IMAGE=${{ secrets.DOCKER_USERNAME }}/contactbook-api:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # -a, not just dangling: each deploy tags a new image by SHA, so
            # last deploy's image is a properly-tagged, zero-container image
            # once `up -d` swaps to the new one -- plain prune only ever
            # touches untagged layers and leaves these to accumulate. This VM
            # has a 9.7G disk; four leftover ~1.6G tags filled it completely
            # and broke the next deploy's SCP step with no disk left to write
            # to. The currently-running image is always safe here since `up
            # -d` already has a container on it by this point.
            docker image prune -a -f
