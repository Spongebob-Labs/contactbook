name: Deploy API

on:
  push:
    branches: [main, refac-new-build]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "docker/docker-compose.prod.yml"
      - "docker/Caddyfile"
      - "scripts/render-api-env.sh"
      - ".github/workflows/deploy.yml"

# Never run two deploys of the same branch concurrently — a docker-compose
# restart racing a migration from a second run is exactly the kind of thing
# that only shows up in production.
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api lint
      - run: pnpm --filter api build
      - run: pnpm --filter api test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    # Environment-scoped so `main` and this branch can each hold their own
    # value under the SAME secret name (DATABASE_URL, TASKS_TARGET_BASE_URL,
    # ...) without colliding — set these under Settings → Environments →
    # staging, not as repository-wide secrets.
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api
      - name: Write Supabase root cert
        run: echo "${{ secrets.SUPABASE_CA_CERT }}" > /tmp/supabase-ca.crt
      - name: Run migrations against Supabase directly (session-mode URL, not the pooler)
        working-directory: apps/api
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

  build-and-push:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: image
        run: echo "tag=${{ secrets.DOCKER_USERNAME }}/contactbook-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render .env from secrets
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_OTP_CONTENT_SID: ${{ secrets.TWILIO_OTP_CONTENT_SID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TASKS_QUEUE_PRIORITY: ${{ secrets.TASKS_QUEUE_PRIORITY }}
          TASKS_QUEUE_OUTBOUND: ${{ secrets.TASKS_QUEUE_OUTBOUND }}
          TASKS_TARGET_BASE_URL: ${{ secrets.TASKS_TARGET_BASE_URL }}
          TASKS_OIDC_AUDIENCE: ${{ secrets.TASKS_OIDC_AUDIENCE }}
          TASKS_INVOKER_SA: ${{ secrets.TASKS_INVOKER_SA }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
          GCS_PROFILE_PHOTOS_BUCKET: ${{ secrets.GCS_PROFILE_PHOTOS_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: OUTPUT_PATH=./rendered.env bash scripts/render-api-env.sh

      - name: Append container-internal sslrootcert paths
        run: |
          # The .env above has DATABASE_URL/DIRECT_URL without sslrootcert —
          # render-api-env.sh doesn't know the container path; append it here
          # since it's fixed by docker-compose.prod.yml's volume mount.
          sed -i \
            -e "s#\(DATABASE_URL=.*\)#\1\&sslrootcert=/etc/contactbook/supabase-ca.crt#" \
            -e "s#\(DIRECT_URL=.*\)#\1?sslrootcert=/etc/contactbook/supabase-ca.crt#" \
            ./rendered.env

      - name: Write Supabase root cert
        run: echo "${{ secrets.SUPABASE_CA_CERT }}" > ./rendered-supabase-ca.crt

      - name: Copy deploy files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker/docker-compose.prod.yml,docker/Caddyfile,rendered.env,rendered-supabase-ca.crt"
          target: "~/contactbook-api-staging"
          strip_components: 1

      - name: Restart containers on the VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/contactbook-api-staging
            mv rendered.env .env
            mv rendered-supabase-ca.crt supabase-ca.crt
            chmod 600 .env supabase-ca.crt
            export API_IMAGE=${{ needs.build-and-push.outputs.image }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
